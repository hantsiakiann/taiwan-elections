<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Taiwanese Local Election Forecast</title>
<meta name="description" content="Polls + fundamentals forecast for Taiwan's 22 mayor and magistrate races on November 28, 2026, simulated 10,000 times.">
<link rel="icon" href="https://hantsiakiann.github.io/img/vote.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
<style>
/* Mirrors hantsiakiann.github.io/index.css */
:root{
  --dpp:#1B9431; --kmt:#000099; --tpp:#28C7C7; --ind:#999999;
  --hover:#F0F0F0; --mut:#666666;
}
*{font-size:20px}
html{scroll-behavior:smooth}
body{margin:0;background:#ffffff;color:#000;font-family:"Titillium Web","Noto Sans TC",sans-serif}
.zh-tw{font-family:"Noto Sans TC",sans-serif}
a{color:#0645ad}

.navbar ul{position:fixed;top:0;left:0;width:100%;z-index:999;list-style-type:none;margin:0;padding:0;
  background-color:white;box-shadow:0 0 10px 0 rgba(0,0,0,.2)}
.navbar ul li{float:left}
.navbar ul li a{display:block;color:black;text-align:center;padding:18px 20px;text-decoration:none;font-size:18px}
.navbar ul li a:hover{background-color:var(--hover)}
#nav-title a{font-weight:700}
.navbar .right{float:right}

#main{margin-top:100px}
section{scroll-margin-top:75px}
h1{font-size:54px;text-align:center;margin:0.6em 16px 0.2em}
h2{font-size:40px;padding-left:30px;margin:1.6em 0 0.6em}
h3{font-size:30px;padding-left:30px;margin:1.4em 0 0.6em}
.subtitle{text-align:center;color:var(--mut);font-size:18px;margin:0 16px}
.muted{color:var(--mut)}

table{margin-left:auto;margin-right:auto;border-spacing:0}
tr:hover{background-color:var(--hover)}
.header-row:hover{background-color:transparent}
th{padding:10px}

.dpp{border-left:5px solid var(--dpp)} .kmt{border-left:5px solid var(--kmt)}
.tpp{border-left:5px solid var(--tpp)} .ind{border-left:5px solid var(--ind)}
.chance{width:70px;height:40px;line-height:40px;text-align:center;color:white;margin:auto}
.chance.small{width:60px;height:36px;line-height:36px;font-size:18px}
.bg-dpp{background-color:var(--dpp)} .bg-kmt{background-color:var(--kmt)}
.bg-tpp{background-color:var(--tpp)} .bg-ind{background-color:var(--ind)}
.c-dpp{color:var(--dpp)} .c-kmt{color:var(--kmt)} .c-tpp{color:#1fa9a9} .c-ind{color:#808080}
.party-name{font-size:16px;font-style:italic;margin:0;color:var(--mut)}
.logo{width:60px;height:60px;border-radius:60px;display:block}
td.image{padding:10px 15px}
td.party{padding:10px 50px 10px 10px}
td.vote{padding:0 20px 0 10px;white-space:nowrap}

/* seats table: one continuous majority line down the bar column */
#seat-table td.share-bar{padding:0 10px 0 20px;position:relative}
#seat-table td.share-bar::after{content:"";position:absolute;top:0;bottom:0;left:calc(20px + 125px - 1px);width:2px;background:#666666}
#seat-table td.seats{padding:20px 30px}
#seat-table td.num,#seat-table th.num{text-align:center;padding:0 40px;font-weight:600;white-space:nowrap}

/* rating badges (2024 page's .legislative-rating colors, plus TPP / independent steps) */
.rating{display:inline-block;text-align:center;width:120px;font-size:16px;padding:5px;color:white}
.rating.r-dpp3{background:#1B9431} .rating.r-dpp2{background:#49A95A} .rating.r-dpp1{background:#77BF83}
.rating.r-kmt3{background:#3333AD} .rating.r-kmt2{background:#6666C2} .rating.r-kmt1{background:#9494D4}
.rating.r-tpp3{background:#28C7C7;color:#000} .rating.r-tpp2{background:#53D2D2;color:#000} .rating.r-tpp1{background:#7EDCDC;color:#000}
.rating.r-ind3{background:#999999} .rating.r-ind2{background:#a3a3a3} .rating.r-ind1{background:#bdbdbd;color:#000}
.rating.r-tu{background:#D7D7D7;color:#000}

/* map + side panel */
.panel-box{display:flex;align-items:center;padding:0 30px}
.map{width:40%}
.prediction-table{width:60%}
#map svg{display:block;margin:auto;max-height:80vh;width:100%;height:auto}
#map path.co{stroke:#000;stroke-width:.45;cursor:pointer}
#map .inset{fill:none;stroke:#000;stroke-width:.6}
#panel-head{font-size:28px;font-weight:700;padding:10px;text-align:left}
#panel-head .zh-tw{font-size:20px;font-weight:400;color:var(--mut);margin-left:8px}
#panel-head .rating{float:right;font-size:18px;width:130px;padding:8px}
#panel .col-label{font-size:18px;font-weight:700;color:#333}
#panel td.share-bar{padding:0 10px 0 20px}
#panel .ci{display:block;font-size:14px;color:var(--mut)}
.rkey{margin-top:24px}
.rkey td{padding:6px 10px;font-size:18px;vertical-align:middle;line-height:1.2}
.rkey td.races{color:var(--mut);font-size:16px;max-width:520px}
.rkey .rating{width:110px;font-size:15px;vertical-align:middle}

/* seat histogram */
#seatchart{max-width:1100px;margin:0 auto;padding:0 30px}
#seatchart svg{display:block;width:100%;height:auto;overflow:visible}
#seatchart text{font-size:12px;fill:var(--mut)}

/* toggle buttons */
.filters{text-align:center;margin:0 16px 12px}
.filters .lab{font-size:18px;color:var(--mut);margin-right:6px}
.filters button{font-family:inherit;font-size:18px;border:1px solid #ccc;background:white;color:#000;padding:6px 16px;margin:4px;cursor:pointer}
.filters button:hover{background:var(--hover)}
.filters button[aria-pressed="true"]{background:#000;color:white;border-color:#000}

/* races table, in the style of the 2024 district-seat tables */
#races td{padding:10px 25px 10px 10px;vertical-align:middle}
#races td.district{font-weight:700;width:200px;padding:15px 30px;text-align:center}
#races td.district .zh-tw{display:block;font-weight:400;color:var(--mut);font-size:16px}
#races td.district .rating{margin-top:8px}
#races td.candidate{width:250px;min-width:250px}
#races td.candidate .row{display:flex;align-items:center;justify-content:space-between;gap:14px}
#races td.candidate .row + .row{margin-top:12px}
#races td.candidate .row > div:first-child{flex:1;min-width:0}
#races td.candidate .chance{flex:0 0 60px}
#races td.candidate .nm{font-size:20px}
#races td.empty{border-left:5px solid transparent}
#races th{font-size:20px}
#races tr.race{cursor:pointer;scroll-margin-top:80px}
#races .ptable th{font-size:16px;color:#666}
.flip{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-top:2px}
.flip b{font-size:14px}
.scroll{overflow-x:auto;padding:0 16px}

tr.detail:hover{background:transparent}
tr.detail > td{background:#fafafa;padding:20px 30px !important}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:30px;text-align:left}
.kv div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #e6e6e6;padding:4px 0}
.kv span,.kv b{font-size:17px}
.ptable{margin:0;width:100%}
.ptable td,.ptable th,#races .ptable td,#races .ptable th{padding:5px 10px;font-size:16px;vertical-align:middle;line-height:1.3}
.ptable th{vertical-align:bottom}
#races .ptable th.lft,#races .ptable td.lft{text-align:left !important}
#races .ptable th.ctr,#races .ptable td.ctr{text-align:center !important}
.ptable *{font-size:16px}
.ptable th .sub{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.ptable td.lead{font-weight:600;white-space:nowrap}
.ptable td.ctr.c-dpp,.ptable td.ctr.c-kmt,.ptable td.ctr.c-tpp,.ptable td.ctr.c-ind{font-weight:600}
.tag{font-size:13px;border:1px solid #bbb;color:var(--mut);padding:0 5px;margin-left:4px;white-space:nowrap}
.cap{font-size:16px;color:var(--mut);margin-bottom:4px}

.tip{position:fixed;pointer-events:none;background:#222;color:#fff;padding:6px 9px;opacity:0;transition:opacity .08s;z-index:1000;white-space:nowrap}
.tip,.tip *{font-size:15px}
footer{padding:40px 30px;color:var(--mut)}
footer *{font-size:16px}

@media screen and (max-width:1350px){
  .panel-box{display:block}
  .map,.prediction-table{width:100%}
  #map svg{max-height:70vh}
}
@media screen and (max-width:760px){
  *{font-size:17px}
  h1{font-size:36px} h2{font-size:30px;padding-left:16px} h3{font-size:24px;padding-left:16px}
  .navbar ul li.opt{display:none}
  .navbar ul li a{padding:16px 12px;font-size:16px}
  .panel-box{padding:0 16px}
  #seatchart{padding:0 12px}
  td.party{padding:10px}
  td.image{padding:8px}
  .logo{width:44px;height:44px}
  .hide-s{display:none}
  #seat-table td.share-bar{padding:0 6px}
  #seat-table td.share-bar::after{left:calc(6px + 45px - 1px)}
  #seat-table .share-bar svg{width:90px}
  #seat-table td.seats{padding:10px 8px}
  #panel-head{font-size:22px}
  #panel-head .rating{width:auto;padding:5px 8px;font-size:15px}
  #panel .share-bar svg{width:70px}
  #panel td.vote{padding:0 6px;font-size:15px}
  #panel td.image{padding:6px}
  #panel .logo{width:36px;height:36px}
  #panel td.party{padding-right:8px !important}
  #panel .zh-tw{display:none}
  #races td.district{width:auto;padding:12px 10px}
  #races td.candidate{width:auto}
  .dgrid{grid-template-columns:1fr}
}
</style>
</head>
<body class="en">
<div class="navbar">
  <ul>
    <li id="nav-title"><a href="#main">2026 Local Election Forecast</a></li>
    <li class="opt"><a href="#seats">Seats</a></li>
    <li class="opt"><a href="#ratings">Map</a></li>
    <li class="opt"><a href="#races-sec">Races</a></li>
    <li class="right opt"><a href="https://hantsiakiann.github.io/">2024 Predictions</a></li>
  </ul>
</div>

<div id="main">
  <h1>2026 Taiwanese Local Election Forecast</h1>
  <p class="subtitle" id="stamp"></p>

  <section id="seats">
    <h2>Seats</h2>
    <table id="seat-table"></table>
    <h3>Seats won across 10,000 simulations</h3>
    <div class="filters" role="group" aria-label="Party shown in the seat chart" id="seat-toggle">
      <button data-p="DPP" aria-pressed="true">DPP</button>
      <button data-p="KMT" aria-pressed="false">KMT</button>
      <button data-p="TPP" aria-pressed="false">TPP</button>
    </div>
    <div id="seatchart"></div>
  </section>

  <section id="ratings">
    <h2>Race Ratings</h2>
    <div class="panel-box">
      <div class="map" id="map" aria-label="Map of race ratings"></div>
      <div class="prediction-table">
        <table id="panel"></table>
        <table class="rkey" id="rkey"></table>
      </div>
    </div>
  </section>

  <section id="races-sec">
    <h2>Races</h2>
    <div class="filters" role="group" aria-label="Sort races">
      <span class="lab">Sort:</span>
      <button data-s="geo" aria-pressed="true">Geographic</button>
      <button data-s="lean" aria-pressed="false">Partisanship (DPP to KMT)</button>
    </div>
    <div class="filters" role="group" aria-label="Filter races">
      <span class="lab">Show:</span>
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="municipality" aria-pressed="false">Special municipalities</button>
      <button data-f="close" aria-pressed="false">Competitive</button>
      <button data-f="flip" aria-pressed="false">Likely flips</button>
    </div>
    <div class="scroll">
    <table id="races">
      <tr class="header-row"><th></th><th title="Democratic Progressive Party">DPP</th><th title="Kuomintang">KMT</th><th title="Taiwan People's Party">TPP</th><th>Independent</th></tr>
      <tbody></tbody>
    </table>
    </div>
  </section>
  <footer>Model output generated <span id="gen"></span>.</footer>
</div>
<div class="tip" id="tip"></div>

<script>
const IMG = "https://hantsiakiann.github.io/img/";
const PARTY = {
  dpp: {name: "Democratic Progressive Party", short: "DPP", logo: "dpp.png", color: "#1B9431"},
  kmt: {name: "Kuomintang", short: "KMT", logo: "kmt.svg", color: "#000099"},
  tpp: {name: "Taiwan People's Party", short: "TPP", logo: "tpp.png", color: "#28C7C7"},
  ind: {name: "Independent", short: "IND", logo: "ind.svg", color: "#999999"},
};
const PARTIES = ["dpp", "kmt", "tpp", "ind"];
// Wikipedia order
const GEO = ["TPE","NWT","TAO","TXG","TNN","KHH","KEE","ILA","HSQ","HSZ","MIA","CHA","NAN","YUN","CYQ","CYI","PIF","HUA","TTT","PEN","KIN","LIE"];
// party currently holding each seat (Ann Kao left the TPP in 2024; Kinmen's Chen Fu-hai is independent)
const HOLDER = {TPE:"kmt",NWT:"kmt",TAO:"kmt",TXG:"kmt",TNN:"dpp",KHH:"dpp",KEE:"kmt",ILA:"kmt",HSQ:"kmt",HSZ:"ind",MIA:"kmt",CHA:"kmt",NAN:"kmt",YUN:"kmt",CYQ:"dpp",CYI:"kmt",PIF:"dpp",HUA:"kmt",TTT:"kmt",PEN:"dpp",KIN:"ind",LIE:"kmt"};

const fmtP = p => p >= 0.995 ? ">99%" : p <= 0.005 ? "<1%" : Math.round(p * 100) + "%";
const pct1 = x => (x * 100).toFixed(1) + "%";
const pct0 = x => Math.round(x * 100);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tip = document.getElementById("tip");
function showTip(e, html){ tip.innerHTML = html; tip.style.opacity = 1; const w = tip.offsetWidth; tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip(){ tip.style.opacity = 0; }

const partyKey = lab => /^DPP/.test(lab) ? "dpp" : /^KMT/.test(lab) ? "kmt" : /^TPP/.test(lab) ? "tpp" : "ind";
const partyShort = lab => lab.replace(/^IND/, "Independent");

// candidates of a race: {slot, name, zh, label, party, p, share:[p10,p50,p90]}
function cands(r){
  const out = [];
  for (const k of ["G", "B", "T", "I"]){
    const c = r.candidates[k]; if (!c) continue;
    let share = r.vote_share && r.vote_share[k] ? r.vote_share[k] : null;
    if (r.nonpartisan){
      const q = r.kmt_vs_top_indep.p10_p50_p90;
      share = k === "B" ? q : [1 - q[2], 1 - q[1], 1 - q[0]];
    }
    out.push({slot: k, name: c[0], zh: c[1], label: c[2], party: partyKey(c[2]), p: r.win_prob[k] ?? 0, share});
  }
  return out;
}

// ratings by the favorite's party
const RATING_CUTS = [[0.95, 3, "Safe"], [0.80, 2, "Likely"], [0.60, 1, "Lean"]];
function rating(r){
  const fav = cands(r).sort((a, b) => b.p - a.p)[0];
  for (const [cut, lvl, lab] of RATING_CUTS) if (fav.p >= cut) return {key: fav.party + lvl, label: `${lab} ${PARTY[fav.party].short}`, p: fav.p, party: fav.party};
  return {key: "tu", label: "Tossup", p: fav.p, party: fav.party};
}
const ratingBadge = r => { const rt = rating(r); return `<div class="rating r-${rt.key}">${rt.label}</div>`; };
const FILL = {dpp3:["#5fb46f","#1B9431"], dpp2:["#80c38c","#49a95a"], dpp1:["#a0d2a8","#77bf83"],
              kmt3:["#4d4db8","#000099"], kmt2:["#7070c6","#3333ad"], kmt1:["#a6a6dc","#9494d4"],
              tpp3:["#5dd3d3","#28C7C7"], tpp2:["#85dede","#53d2d2"], tpp1:["#ade9e9","#7edcdc"],
              ind3:["#a3a3a3","#7a7a7a"], ind2:["#bdbdbd","#a3a3a3"], ind1:["#d6d6d6","#bdbdbd"],
              tu:["#ebebeb","#d7d7d7"]};

Promise.all([fetch("output/forecast_2026.json").then(r => r.json()),
             fetch("../data/taiwan_map.json").then(r => r.json()).catch(() => null)])
  .then(([F, M]) => { render(F); if (M) drawMap(F, M); });

function render(F){
  const asOf = new Date(F.as_of + "T12:00:00");
  document.getElementById("stamp").textContent = "Updated " + asOf.toLocaleDateString("en-US", {month: "long", day: "numeric", year: "numeric"});
  document.getElementById("gen").textContent = F.generated.replace("T", " ").replace("+00:00", " UTC");
  seatTable(F);
  seatChart(F, "DPP");
  document.querySelectorAll("#seat-toggle button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#seat-toggle button").forEach(o => o.setAttribute("aria-pressed", o === b));
    seatChart(F, b.dataset.p);
  }));
  raceTable(F);
}

function seatTable(F){
  const n = 22, W = 250;
  const mk = k => ({k, s: F.party_seats[k.toUpperCase()], prev: F.party_seats_2022[k.toUpperCase()]});
  const rows = [mk("kmt"), mk("dpp")].sort((a, b) => b.s.mean - a.s.mean).concat([mk("tpp"), mk("ind")]);
  document.getElementById("seat-table").innerHTML =
    `<tr class="header-row"><th colspan="2">Party</th><th colspan="2">Projected seats</th><th class="num hide-s">80% range</th><th class="num hide-s">2022</th></tr>` +
    rows.map(({k, s, prev}) => `<tr>
      <td class="image ${k}"><img class="logo" src="${IMG + PARTY[k].logo}" alt=""></td>
      <td class="party">${PARTY[k].name}</td>
      <td class="share-bar"><svg width="${W}" height="90" viewBox="0 0 ${W} 90" preserveAspectRatio="none" aria-hidden="true">
        <rect x="0" y="37.5" width="${W}" height="15" fill="#E4E4E4"/>
        <rect x="0" y="37.5" width="${W * s.mean / n}" height="15" fill="${PARTY[k].color}"/>
        ${whisker(W * s.p10_p90[0] / n, W * s.mean / n, W * s.p10_p90[1] / n, 45, PARTY[k].color)}</svg></td>
      <td class="seats"><div class="chance bg-${k}">${s.mean.toFixed(1)}</div></td>
      <td class="num hide-s c-${k}">${s.p10_p90[0] === s.p10_p90[1] ? s.p10_p90[0] : s.p10_p90[0] + "–" + s.p10_p90[1]}</td>
      <td class="num hide-s c-${k}">${prev}</td></tr>`).join("");
}

function seatChart(F, party){
  const S = F.party_seats[party], n = F.n_sims, color = PARTY[party.toLowerCase()].color;
  const W = 1000, H = 230, m = {l:40, r:10, t:10, b:34};
  const bw = (W - m.l - m.r) / 23;
  const maxV = Math.max(...S.hist) / n;
  const step = maxV > 0.4 ? 0.1 : 0.05;
  const yMax = Math.max(Math.ceil(maxV / step) * step, step);
  const y = v => m.t + (H - m.t - m.b) * (1 - v / yMax);
  let g = "";
  for (let t = 0; t <= yMax + 1e-9; t += step){
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="#e6e6e6"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`;
  }
  for (let s = 0; s <= 22; s++){
    const x0 = m.l + s * bw, v = S.hist[s] / n;
    if (v > 0) g += `<rect x="${x0 + 3}" y="${y(v)}" width="${bw - 6}" height="${Math.max(H - m.b - y(v), 1)}" fill="${color}"/>`;
    g += `<rect x="${x0}" y="${m.t}" width="${bw}" height="${H - m.t - m.b}" fill="transparent" data-s="${s}"/>`;
    g += `<text x="${x0 + bw / 2}" y="${H - m.b + 18}" text-anchor="middle">${s}</text>`;
  }
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="#666"/>`;
  g += `<line x1="${m.l + 11.5 * bw}" x2="${m.l + 11.5 * bw}" y1="${m.t}" y2="${H - m.b}" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  const el = document.getElementById("seatchart");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of ${party} seats across simulations">${g}</svg>`;
  el.querySelectorAll("rect[data-s]").forEach(r => {
    const s = +r.dataset.s;
    r.addEventListener("mousemove", e => showTip(e, `<b>${party}: ${s} seat${s === 1 ? "" : "s"}</b><br>${pct1(S.hist[s] / n)} of simulations`));
    r.addEventListener("mouseleave", hideTip);
  });
}

// error bar from lo to hi around the bar end at mid, centered vertically at y
function whisker(lo, mid, hi, y, color){
  const [inC, outC] = WHISKER[color];
  return `<line x1="${lo}" x2="${mid}" y1="${y}" y2="${y}" stroke="${inC}" stroke-width="2"/>
    <line x1="${mid}" x2="${hi}" y1="${y}" y2="${y}" stroke="${outC}" stroke-width="2"/>
    <line x1="${lo}" x2="${lo}" y1="${y - 5.5}" y2="${y + 5.5}" stroke="${lo < mid ? inC : outC}" stroke-width="2"/>
    <line x1="${hi}" x2="${hi}" y1="${y - 5.5}" y2="${y + 5.5}" stroke="${hi > mid ? outC : inC}" stroke-width="2"/>`;
}
// whisker colors per party: [over the colored fill, over the gray track]
const WHISKER = {"#1B9431": ["#0b4f17", "#0b4f17"], "#000099": ["#a9b1ff", "#000099"],
                 "#28C7C7": ["#0d6262", "#0d6262"], "#999999": ["#3d3d3d", "#3d3d3d"]};
function bar(share, color, w){
  if (!share) return `<svg width="${w}" height="15" viewBox="0 0 ${w} 15" preserveAspectRatio="none" aria-hidden="true"><rect width="${w}" height="15" fill="#E4E4E4"/></svg>`;
  const [lo, mid, hi] = share.map(v => v * w);
  return `<svg width="${w}" height="15" viewBox="0 0 ${w} 15" preserveAspectRatio="none" aria-hidden="true">
    <rect x="0" y="0" width="${w}" height="15" fill="#E4E4E4"/><rect x="0" y="0" width="${mid}" height="15" fill="${color}"/>
    <line x1="${lo}" x2="${mid}" y1="7.5" y2="7.5" stroke="${WHISKER[color][0]}" stroke-width="2"/>
    <line x1="${mid}" x2="${hi}" y1="7.5" y2="7.5" stroke="${WHISKER[color][1]}" stroke-width="2"/>
    <line x1="${lo}" x2="${lo}" y1="2" y2="13" stroke="${WHISKER[color][lo < mid ? 0 : 1]}" stroke-width="2"/>
    <line x1="${hi}" x2="${hi}" y1="2" y2="13" stroke="${WHISKER[color][hi > mid ? 1 : 0]}" stroke-width="2"/></svg>`;
}

function showPanel(r){
  const rows = cands(r).sort((a, b) => b.p - a.p).map(c => `<tr>
      <td class="image ${c.party}"><img class="logo" src="${IMG + PARTY[c.party].logo}" alt=""></td>
      <td class="party" style="padding-right:30px">${esc(c.name)} <span class="zh-tw muted" style="font-size:16px">${esc(c.zh)}</span><p class="party-name">${esc(partyShort(c.label))}</p></td>
      <td class="share-bar">${bar(c.share, PARTY[c.party].color, 200)}</td>
      <td class="vote">${c.share ? pct1(c.share[1]) + `<span class="ci">${pct0(c.share[0])}–${pct0(c.share[2])}%</span>` : ""}</td>
      <td><div class="chance small bg-${c.party}">${fmtP(c.p)}</div></td></tr>`).join("");
  document.getElementById("panel").innerHTML =
    `<tr class="header-row"><th id="panel-head" colspan="5">${esc(r.name_en)}<span class="zh-tw">${esc(r.name_zh)}</span>${ratingBadge(r)}</th></tr>
     <tr class="header-row"><th colspan="2"></th><th colspan="2" class="col-label">Projected vote share<span class="ci" style="font-weight:400">median, with 80% range</span></th><th class="col-label">Chance of winning</th></tr>
     ${rows}`;
}

function drawMap(F, M){
  const inset = {};
  (M.insets || []).forEach(i => { if (i.iso) inset[i.iso] = i.box; });
  let main = "", defs = "", groups = "", ann = "";
  const clip = {};
  for (const [iso, g] of Object.entries(M.counties)){
    const r = F.races[iso]; if (!r || !g.d) continue;
    const el = `<path class="co" data-iso="${iso}" d="${g.d}" style="fill:${FILL[rating(r).key][0]}"/>`;
    if (inset[iso]) clip[iso] = el; else main += el;
  }
  (M.insets || []).forEach(i => {
    if (i.box && i.iso){
      const [x, y, w, h] = i.box;
      defs += `<clipPath id="ins-${i.iso}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>`;
      groups += `<g clip-path="url(#ins-${i.iso})">${clip[i.iso] || ""}</g>`;
      ann += `<rect class="inset" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
    }
  });
  const el = document.getElementById("map");
  el.innerHTML = `<svg viewBox="${M.viewBox.join(" ")}" role="img" aria-label="Taiwan counties shaded by race rating"><defs>${defs}</defs>${main}${groups}${ann}</svg>`;
  el.querySelectorAll("path.co").forEach(p => {
    const iso = p.dataset.iso, r = F.races[iso], f = FILL[rating(r).key];
    p.addEventListener("mouseenter", () => { p.style.fill = f[1]; showPanel(r); });
    p.addEventListener("mouseleave", () => { p.style.fill = f[0]; });
    p.addEventListener("click", () => { showPanel(r); openRace(iso); });
  });
  showPanel(F.races.TPE);

  const order = ["dpp3","dpp2","dpp1","tu","kmt1","kmt2","kmt3","tpp1","tpp2","tpp3","ind1","ind2","ind3"];
  const lab = k => k === "tu" ? "Tossup" : `${["", "Lean", "Likely", "Safe"][+k.slice(3)]} ${PARTY[k.slice(0, 3)].short}`;
  const by = {};
  GEO.forEach(iso => { const r = F.races[iso], k = rating(r).key; (by[k] = by[k] || []).push(r.name_en); });
  const always = new Set(["dpp3","dpp2","dpp1","tu","kmt1","kmt2","kmt3"]);
  document.getElementById("rkey").innerHTML = order.filter(k => by[k] || always.has(k)).map(k =>
    `<tr><td><div class="rating r-${k}">${lab(k)}</div></td><td style="text-align:center"><b>${(by[k] || []).length}</b></td><td class="races">${(by[k] || []).join(", ") || "—"}</td></tr>`).join("");
}

let openRace = () => {};
// column for a candidate: the camp slot for the two main candidates, own party otherwise
const column = c => c.slot === "G" ? "dpp" : c.slot === "B" ? "kmt" : c.party;
function raceTable(F){
  const rows = GEO.filter(iso => F.races[iso]).map((iso, gi) => {
    const r = F.races[iso], cs = cands(r);
    const fav = cs.slice().sort((a, b) => b.p - a.p)[0];
    const pG = r.win_prob.G ?? 0, pB = r.win_prob.B ?? 0;
    return {iso, r, cs, gi, fav, pG, pB, flip: fav.p > 0.5 && fav.party !== HOLDER[iso] ? HOLDER[iso] : null};
  });
  let filt = "all", sort = "geo";
  const tb = document.querySelector("#races tbody");
  function cell(list){
    if (!list.length) return `<td class="candidate empty"></td>`;
    const k = list[0].party;
    return `<td class="candidate ${k}">${list.map(c => `<div class="row"><div><span class="nm">${esc(c.name)}</span><p class="party-name">${esc(partyShort(c.label))}</p></div><div class="chance small bg-${c.party}">${fmtP(c.p)}</div></div>`).join("")}</td>`;
  }
  function draw(){
    const rs = rows.filter(x => filt === "all" || (filt === "municipality" && x.r.tier === "municipality") ||
      (filt === "close" && x.fav.p < 0.80) || (filt === "flip" && x.flip));
    if (sort === "geo") rs.sort((a, b) => a.gi - b.gi);
    else rs.sort((a, b) => (b.pG - a.pG) || (a.pB - b.pB) || (a.gi - b.gi));
    tb.innerHTML = rs.map(x => `<tr class="race" data-iso="${x.iso}" tabindex="0" aria-expanded="false">
        <td class="district">${esc(x.r.name_en)}<span class="zh-tw">${esc(x.r.name_zh)}</span>${ratingBadge(x.r)}${x.flip ? `<span class="flip">Flip from <b class="c-${x.flip}">${PARTY[x.flip].short}</b></span>` : ""}</td>
        ${PARTIES.map(p => cell(x.cs.filter(c => column(c) === p))).join("")}</tr>`).join("")
      || `<tr><td colspan="5" class="muted" style="text-align:center">No races in this group.</td></tr>`;
    tb.querySelectorAll("tr.race").forEach(tr => {
      const tog = () => toggle(tr);
      tr.addEventListener("click", tog);
      tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); tog(); } });
    });
  }
  function toggle(tr, forceOpen){
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("detail")){ if (forceOpen) return; next.remove(); tr.setAttribute("aria-expanded", "false"); return; }
    tr.setAttribute("aria-expanded", "true");
    const d = document.createElement("tr"); d.className = "detail";
    d.innerHTML = `<td colspan="5">${detail(F.races[tr.dataset.iso])}</td>`;
    tr.after(d);
  }
  openRace = iso => {
    if (filt !== "all") document.querySelector('.filters button[data-f="all"]').click();
    const tr = tb.querySelector(`tr.race[data-iso="${iso}"]`);
    if (tr){ toggle(tr, true); tr.scrollIntoView({behavior: "smooth", block: "start"}); }
  };
  const group = (attr, set) => document.querySelectorAll(`.filters button[${attr}]`).forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(`.filters button[${attr}]`).forEach(o => o.setAttribute("aria-pressed", o === b));
    set(b.getAttribute(attr)); draw();
  }));
  group("data-f", v => filt = v);
  group("data-s", v => sort = v);
  draw();
}

function detail(r){
  const cs = cands(r);
  const slots = cs.map(c => c.slot);                     // e.g. ["G","B","T"] or ["B","I"]
  const field = {G: "green", B: "blue", T: "third", I: "third"};
  const colHead = c => `<span class="c-${c.party}" title="${esc(c.name)}">${PARTY[c.party].short}</span><span class="sub zh-tw">${esc(c.zh)}</span>`;
  const polls = (r.polls || []).slice().sort((a, b) => b.field_end.localeCompare(a.field_end)).map(p => {
    const vals = cs.map(c => ({c, v: parseFloat(p[field[c.slot]])})).filter(o => !isNaN(o.v));
    const top = vals.slice().sort((a, b) => b.v - a.v);
    const lead = top.length > 1 ? `<span class="c-${top[0].c.party}">${PARTY[top[0].c.party].short} +${(top[0].v - top[1].v).toFixed(1)}</span>` : "";
    return `<tr><td class="lft">${esc(p.field_end)}</td>
      <td class="lft">${esc(p.pollster)}${p.sponsor_lean !== "N" ? ` <span class="tag">${p.sponsor_lean === "G" ? "DPP-aligned" : "KMT-aligned"}</span>` : ""}</td>
      ${cs.map(c => `<td class="ctr c-${c.party}">${esc(p[field[c.slot]] || "")}</td>`).join("")}
      <td class="ctr">${esc(p.undecided || "")}</td><td class="ctr lead">${lead}</td></tr>`;
  }).join("");
  const pollTable = `<div class="cap" style="font-weight:700;color:#000;font-size:17px">Polls used</div>
    <table class="ptable"><tr class="header-row"><th class="lft">End date</th><th class="lft">Pollster</th>${cs.map(c => `<th class="ctr">${colHead(c)}</th>`).join("")}<th class="ctr">Und.</th><th class="ctr">Lead</th></tr>
    ${polls || `<tr><td colspan="${cs.length + 4}">No published polls; fundamentals only.</td></tr>`}</table>`;

  // incumbency, named by the incumbent's party
  const incC = r.incumbent === "G" ? cs.find(c => c.slot === "G") : r.incumbent === "B" ? cs.find(c => c.slot === "B") : null;
  const inc = incC ? `<span class="c-${incC.party}">${PARTY[incC.party].short} incumbent</span>` : "Open seat";

  if (r.nonpartisan){
    const q = r.kmt_vs_top_indep.p10_p50_p90;
    return `<div class="dgrid"><div class="kv">
      <div><span>Projected share, ${esc(r.candidates.B[0])} vs. ${esc(r.candidates.I[0])}</span><b>${pct1(q[1])}</b></div>
      <div><span>80% interval</span><b>${pct1(q[0])} – ${pct1(q[2])}</b></div>
      <div><span>Incumbency</span><b>${inc}</b></div></div>
      <div>${pollTable}<p class="cap" style="margin-top:10px">${esc(r.note)}</p></div></div>`;
  }
  const f = r.features, q = r.two_camp_green.p10_p50_p90, vs = r.vote_share;
  const leanTxt = v => { const pts = (Math.abs(v) * 25).toFixed(1); return v >= 0 ? `<span class="c-dpp">DPP +${pts}</span>` : `<span class="c-kmt">KMT +${pts}</span>`; };
  const share = k => vs[k] ? `${pct1(vs[k][1])} <span class="muted" style="font-weight:400;font-size:15px">(${pct1(vs[k][0])}–${pct1(vs[k][2])})</span>` : "";
  return `<div class="dgrid">
    <div class="kv">
      ${cs.map(c => `<div><span>Projected vote share, ${esc(c.name)}</span><b>${share(c.slot)}</b></div>`).join("")}
      <div><span>DPP two-candidate share, 80% interval</span><b>${pct1(q[0])} – ${pct1(q[2])}</b></div>
      <div><span>Fundamentals-only estimate</span><b>${pct1(r.fundamentals_only_green)}</b></div>
      <div><span>House-adjusted poll average</span><b>${r.poll_avg_green == null ? "—" : pct1(r.poll_avg_green)}</b></div>
      <div><span>Weight on polls vs. fundamentals</span><b>${Math.round(r.poll_weight * 100)}%</b></div>
      <div><span>Presidential lean (2024)</span><b>${leanTxt(f.pres)}</b></div>
      <div><span>Party-list lean (2024)</span><b>${leanTxt(f.pl)}</b></div>
      <div><span>2022 mayoral result vs. national</span><b>${leanTxt(f.prev)}</b></div>
      <div><span>Incumbency</span><b>${inc}</b></div>
    </div>
    <div>${pollTable}</div></div>`;
}
</script>
</body>
</html>
